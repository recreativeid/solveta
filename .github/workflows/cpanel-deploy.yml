name: Auto Deploy CodeIgniter 4 to cPanel (solveta.asia)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "cpanel-deploy"
  cancel-in-progress: false

jobs:
  deploy-to-cpanel:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install basic-ftp
        run: npm install basic-ftp

      - name: 🚀 Deploy CodeIgniter 4 to cPanel via FTPS
        id: deploy
        run: |
          node .github/deploy.js 2>&1 | tee deploy.log
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}

      - name: 📢 Save Deployment Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log
