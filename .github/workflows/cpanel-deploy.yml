name: Auto Deploy CodeIgniter 4 to cPanel (solveta.asia)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "cpanel-deploy"
  cancel-in-progress: false

jobs:
  deploy-to-cpanel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install basic-ftp
        run: npm install basic-ftp

      - name: 🚀 Deploy CodeIgniter 4 to cPanel via FTPS
        id: deploy
        run: |
          node .github/deploy.js 2>&1 | tee deploy.log
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}

      - name: 📋 Commit deployment log to repository
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add -f deploy.log
          git commit -m "chore: save cpanel deploy log [skip ci]" || true
          git push || true
